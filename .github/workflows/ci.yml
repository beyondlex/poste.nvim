name: CI

on:
  push:
    branches: [main, refactoring, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Rust ${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      # Zero-warning baseline since the 2026-09-13 release prep: any clippy
      # warning fails the build (the pre-existing warnings were cleared).
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

      - name: Check for TODO/FIXME/HACK
        run: |
          ! grep -rn "TODO\|FIXME\|HACK" crates/ --include="*.rs" | grep -v "target/" || exit 1

  # Lua jobs were removed with the 2026-09-13 family dissolution (and its
  # cleanup): the Lua plugin family lives in the sibling repos, each with its
  # own test suite; this repo is Rust-only now.
