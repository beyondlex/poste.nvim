[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/beyondlex/poste"
description = "Multi-protocol request executor: HTTP, SQL, Redis, MongoDB, AMQP — from your editor"
authors = ["Lex <lex@beyondlex.com>"]
readme = "README.md"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
poste-core = { path = "crates/poste-core", version = "0.1.0" }
poste-exec = { path = "crates/poste-exec", version = "0.1.0" }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "io-std", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
rand = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "mysql", "sqlite", "json", "chrono", "uuid", "ipnetwork", "rust_decimal"] }
rust_decimal = "1"
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono", "tds73", "rust_decimal"] }
tokio-util = { version = "0.7", features = ["compat"] }
# AMQP 0-9-1 for `poste mq-exec` (poste-mq.nvim M2). lapin is the mature
# runtime-agnostic client; default tokio runtime matches redis tokio-comp.
lapin = "2.5"
# ClickHouse: SQL over HTTP. The official `clickhouse` crate is SELECT-only
# (it appends ` FORMAT x` to the SQL text and forces readonly=1), so the
# executor uses a raw reqwest transport instead — the first HTTP transport
# in poste-exec. reqwest is also the base for any future HTTP dialect (Trino).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
