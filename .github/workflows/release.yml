name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: x86_64-linux
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            name: aarch64-linux
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            name: aarch64-macos
            ext: ""
            extra_target: x86_64-apple-darwin
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: x86_64-windows
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}

      - name: Install extra target (macOS x86_64)
        if: matrix.extra_target
        run: rustup target add ${{ matrix.extra_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} -p poste-cli

      - name: Build (macOS x86_64)
        if: matrix.extra_target
        run: cargo build --release --target ${{ matrix.extra_target }} -p poste-cli

      # Packaging is a contract with the editor plugins, not an internal detail.
      # poste-db.nvim, poste-redis.nvim, poste-es.nvim, poste-for-db and
      # poste-for-mq each fetch `poste-<name>.<ext>` at Neovim startup
      # and unpack it into stdpath("data")/poste/bin, so all three of these
      # have to hold:
      #   - the asset name is exactly poste-<name>.tar.gz / .zip, <name> being
      #     one of x86_64-linux, aarch64-linux, aarch64-macos, x86_64-macos,
      #     x86_64-windows — the installer derives that string from
      #     os_uname() and has no lookup or index step. x86_64-macos is the
      #     odd one: it is not a matrix name, it is the extra target built in
      #     the aarch64-macos job and its asset name is hard-coded below.
      #   - the archive holds the bare binary at its root, with no wrapping
      #     directory, named poste on Unix and poste.exe on Windows — the same
      #     name the installer writes and the plugin's binary lookup resolves;
      #   - poste-<name>.<ext>.sha256 is `sha256sum` output: the digest
      #     as the first whitespace-delimited field. Installers compare it
      #     case-insensitively because their local hasher may be certutil,
      #     which prints uppercase.
      # Changing any of the three breaks auto-install in all five plugins at
      # once, and the failure surfaces as a startup error on a stranger's
      # machine rather than here.
      - name: Package (Unix)
        if: matrix.ext == ''
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../poste-${{ matrix.name }}.tar.gz poste
          cd ../../../..

      - name: Package (macOS x86_64)
        if: matrix.extra_target
        run: |
          cd target/${{ matrix.extra_target }}/release
          tar czf ../../../poste-x86_64-macos.tar.gz poste
          cd ../../../..

      - name: Package (Windows)
        if: matrix.ext == '.exe'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../poste-${{ matrix.name }}.zip poste.exe
          cd ../../../..

      - name: Checksum (Unix)
        if: matrix.ext == ''
        run: |
          sha256sum poste-${{ matrix.name }}.tar.gz > poste-${{ matrix.name }}.tar.gz.sha256

      - name: Checksum (macOS x86_64)
        if: matrix.extra_target
        run: |
          sha256sum poste-x86_64-macos.tar.gz > poste-x86_64-macos.tar.gz.sha256

      - name: Checksum (Windows)
        if: matrix.ext == '.exe'
        shell: bash
        run: |
          sha256sum poste-${{ matrix.name }}.zip > poste-${{ matrix.name }}.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            poste-${{ matrix.name }}.tar.gz
            poste-${{ matrix.name }}.zip
            poste-${{ matrix.name }}.tar.gz.sha256
            poste-${{ matrix.name }}.zip.sha256
            poste-x86_64-macos.tar.gz
            poste-x86_64-macos.tar.gz.sha256

  release:
    name: Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten artifacts
        run: |
          mkdir -p assets
          find dist -type f -exec cp {} assets/ \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true